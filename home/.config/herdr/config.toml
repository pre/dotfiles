onboarding = false

[ui]
status_indicators = "symbols"
prompt_new_tab_name = false

[ui.toast]
delivery = "herdr"

[keys]
prefix = "ctrl+f"
next_tab = "alt+right"
previous_tab = "alt+left"
last_pane = ["prefix+d", "prefix+ctrl+d", "alt+space", "prefix+space"]
next_workspace = ["ctrl+alt+space", "alt+down"]
previous_workspace = "alt+up"
next_agent = ["prefix+a", "alt+shift+down"]
previous_agent = ["prefix+shift+a", "alt+shift+up"]
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "shift+k"
navigate_pane_down = "shift+j"
## Does not work with Finnish layout
# switch_workspace = "prefix+shift+1..9"

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
selection_bg = "#463f5d"

[[keys.command]]
key = 'prefix+!'
type = "shell"
description = 'switch to workspace 1'
command = 'herdr workspace focus $(herdr workspace list | jq -r ".result.workspaces[]|select(.number==1)|.workspace_id")'

